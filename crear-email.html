<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agregar correo autorizado - MaxTV</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 40px; }
  input { display: block; margin: 10px 0; padding: 10px; width: 300px; }
  button { padding: 10px 20px; background: #6c4de0; color: white; border: none; cursor: pointer; }
  pre { background: #222; padding: 15px; margin-top: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>Agregar tu correo autorizado (admin)</h2>
  <input id="email" placeholder="tu_correo@gmail.com" type="email">
  <button onclick="crear()">Agregar correo</button>
  <pre id="resultado"></pre>

  <script>
    async function crear() {
      const email = document.getElementById('email').value;
      const res = document.getElementById('resultado');
      res.textContent = 'Guardando...';
      try {
        const r = await fetch('https://max-tv-production-2198.up.railway.app/api/bootstrap/first-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await r.json();
        res.textContent = JSON.stringify(data, null, 2);
        if (r.ok) localStorage.setItem('maxtv_email', email.toLowerCase().trim());
      } catch (err) {
        res.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
